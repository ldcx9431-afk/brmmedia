vm.swappiness = 1
vm.dirty_ratio = 20
vm.dirty_background_ratio = 5
# Evaluated vm.nr_hugepages = 17000 on 2026-11-23: runtime fragmentation only
# yielded 10461 (< 16907 required by Strata 33.02 GiB expert arena), so Strata
# left MAP_HUGETLB unconsumed; kept at 0 to avoid stranding ~20.4 GiB RAM.
vm.nr_hugepages = 0
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.somaxconn = 4096
net.ipv4.tcp_tw_reuse = 1
